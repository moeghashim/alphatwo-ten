services:
  # ── Landing page + form + status UI ───────────────────────────────────────
  - type: web
    name: tenwhy-alphatwo-web
    runtime: node
    rootDir: apps/web
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    domains:
      - alpha.tenwhy.com
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  # ── Orchestrator API (Sapiom sandbox + agent CLI + GitHub + Render) ──────
  - type: web
    name: tenwhy-alphatwo-api
    runtime: node
    rootDir: apps/api
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    domains:
      - api.alpha.tenwhy.com
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tenwhy-alphatwo-db, property: connectionString }

      # Sapiom sandbox
      - key: SAPIOM_API_KEY
        sync: false

      # GitHub
      - key: GITHUB_TOKEN
        sync: false
      - key: GIT_PUSH_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_TEMPLATE_REPO
        sync: false

      # Coding agent — primary
      - key: CODING_AGENT
        value: cursor
      - key: CODING_MODEL
        value: composer-2.5

      # Coding agent — fallback (Gemini Flash default)
      - key: FALLBACK_AGENT
        value: gemini
      - key: FALLBACK_MODEL
        value: gemini-3.5-flash

      # Per-agent secrets (set only the ones you actually use)
      - key: CURSOR_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Render
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: RENDER_REGION
        value: oregon

      # Public URLs
      - key: PLATFORM_BASE_URL
        sync: false
      - key: DATA_API_BASE_URL
        sync: false

      # Timeouts
      - key: AGENT_TIMEOUT_MS
        value: "900000"
      - key: BUILD_TIMEOUT_MS
        value: "300000"
      - key: DEPLOY_POLL_MS
        value: "12000"
      - key: JOB_TIMEOUT_MS
        value: "1800000"

  # ── Multi-tenant document store (the shared DB API) ───────────────────────
  - type: web
    name: tenwhy-alphatwo-data
    runtime: node
    rootDir: apps/data-api
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    domains:
      - data.alpha.tenwhy.com
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tenwhy-alphatwo-db, property: connectionString }
      - key: MAX_DOCS_PER_APP
        value: "10000"
      - key: MAX_BODY_BYTES
        value: "1048576"
      - key: RATE_LIMIT_PER_SEC
        value: "50"

databases:
  - name: tenwhy-alphatwo-db
    databaseName: tenwhy_alphatwo
    user: tenwhy_alphatwo
    plan: starter
