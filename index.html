<html lang="en">
<head>

<title>tenwhy · Factory Map</title>
<link rel="icon" type="image/svg+xml" href="branding/tenwhy.svg" />

<meta property="og:description" content="An AI workforce for small businesses, supplied by a software factory. Interactive map of the pipeline from tool spec to working specialist." />

<style>
  :root {
    --bg: #FAF9F5;
    --bg-2: #F0EEE6;
    --bg-card: #FFFFFF;
    --text: #3D3D3A;
    --text-dim: #87867F;
    --slate: #141413;
    --border: #D1CFC5;
    --border-hi: #B8B5A8;
    --clay: #D97757;       /* factory accent */
    --olive: #788C5D;      /* workforce accent */
    --sky: #6A8CAF;        /* wall / catalog */
    --red: #B04A3F;
    --oat: #E3DACC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---- Header ---- */
  header.top {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  header.top .masthead { display: flex; align-items: center; gap: 16px; }
  header.top .masthead .logo { display: block; width: 124px; height: auto; }
  header.top .masthead .divider { width: 1px; height: 28px; background: var(--border); }
  header.top .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.10em; color: var(--text-dim);
    margin-bottom: 2px;
  }
  header.top h1 {
    margin: 0;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight: 500; font-size: 18px;
    letter-spacing: -0.01em; color: var(--slate);
  }
  header.top h1 .accent { color: var(--clay); }

  /* Sequence chips */
  .chips {
    display: flex; gap: 8px; align-items: center;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    max-width: 100%;
    min-width: 0; /* flex item: allow shrinking below content width */
  }
  .btn {
    font-family: ui-monospace, monospace;
    font-size: 11.5px;
    padding: 7px 13px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all .15s ease;
    user-select: none;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--slate); color: var(--slate); }
  .btn.seq { border-color: rgba(217,119,87,0.55); color: var(--clay); }
  .btn.seq:hover { background: rgba(217,119,87,0.08); }
  .btn.seq.active { background: var(--clay); border-color: var(--clay); color: #fff; }

  /* ---- Caption line ---- */
  .caption {
    min-height: 30px;
    padding: 7px 24px 0;
    font-family: ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: center;
    transition: color .3s ease;
  }
  .caption.live { color: var(--clay); }

  /* ---- Diagram ---- */
  .stage-wrap { padding: 4px 18px 26px; }
  svg.map {
    display: block;
    width: 100%;
    max-width: 1560px;
    height: auto;
    margin: 0 auto;
  }

  svg.map .zone-label {
    font-family: ui-monospace, monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: 1.6px;
    fill: var(--text-dim);
    text-transform: uppercase;
  }
  svg.map .wall-line { stroke: var(--border); stroke-width: 1; }
  svg.map .wall-tag {
    font-family: ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 1.4px;
    fill: var(--text-dim);
  }

  /* nodes */
  svg.map .node { cursor: pointer; }
  svg.map .node .card {
    fill: var(--bg-card);
    stroke: var(--border);
    stroke-width: 1.5;
    transition: stroke .18s ease, filter .18s ease;
  }
  svg.map .node:hover .card,
  svg.map .node:focus-visible .card,
  svg.map .node.selected .card { stroke: var(--slate); }
  svg.map .node:focus-visible { outline: none; }
  svg.map .node .strip { transition: fill .18s ease; }
  svg.map .node .num, svg.map .node .zone {
    font-family: ui-monospace, monospace;
    font-size: 10px; letter-spacing: .6px;
    fill: var(--text-dim);
  }
  svg.map .node .name {
    font-family: ui-serif, Georgia, serif;
    font-size: 20px; font-weight: 500;
    letter-spacing: -0.2px;
    fill: var(--slate);
  }
  svg.map .node .sub {
    font-size: 11.5px;
    fill: var(--text-dim);
  }
  svg.map .node.pulsing .card { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(217,119,87,0)); }
    50%      { filter: drop-shadow(0 0 9px rgba(217,119,87,0.55)); }
  }

  /* ghost (unhired capacity / dormant strip) */
  svg.map .ghostable { transition: opacity .6s ease; }
  svg.map .ghostable.ghost { opacity: 0.22; }

  /* edges */
  svg.map path.edge { fill: none; stroke: var(--border-hi); stroke-width: 1.4; }
  svg.map path.edge.loop { stroke: var(--clay); stroke-dasharray: 4 4; opacity: .55; }
  svg.map .edge-label {
    font-family: ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: .8px;
    fill: var(--text-dim);
    text-transform: uppercase;
  }
  svg.map .company-label {
    font-family: ui-monospace, monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: 1.3px;
    fill: var(--clay);
    text-transform: uppercase;
  }
  svg.map .shift-tag {
    font-family: ui-monospace, monospace;
    font-size: 11px; font-weight: 600;
    letter-spacing: .8px;
    fill: var(--sky);
    opacity: 0;
    transition: opacity .4s ease;
  }
  svg.map .shift-tag.show { opacity: 1; }

  /* timeline (shifts sequence) */
  svg.map .timeline { transition: opacity .5s ease; }
  svg.map .timeline.hidden { opacity: 0; }
  svg.map .timeline .tl-line { stroke: var(--border-hi); stroke-width: 1; }
  svg.map .timeline .tl-tick {
    font-family: ui-monospace, monospace;
    font-size: 10px; fill: var(--text-dim); letter-spacing: .5px;
  }
  svg.map .tl-marker { fill: var(--sky); }

  /* approval pill (hire sequence) */
  svg.map .approve { transition: opacity .4s ease; }
  svg.map .approve.hidden { opacity: 0; }
  svg.map .approve rect { fill: rgba(120,140,93,0.14); stroke: var(--olive); stroke-width: 1.2; }
  svg.map .approve text {
    font-family: ui-monospace, monospace;
    font-size: 11px; font-weight: 600; letter-spacing: .8px;
    fill: var(--olive);
  }

  /* packets */
  svg.map .packet { opacity: 0; }
  svg.map .packet.visible { opacity: 1; }

  /* validator verdict flash */
  svg.map .verdict {
    font-family: ui-monospace, monospace;
    font-size: 13px; font-weight: 700;
    fill: var(--olive);
    opacity: 0;
    transition: opacity .3s ease;
  }
  svg.map .verdict.show { opacity: 1; }

  /* ---- Drawer ---- */
  .drawer {
    position: fixed;
    top: 76px; right: 18px; bottom: 18px;
    width: 372px; max-width: calc(100vw - 36px);
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 14px 44px rgba(20,20,19,0.13);
    padding: 24px 26px;
    overflow-y: auto;
    z-index: 40;
    transform: translateX(calc(100% + 24px));
    transition: transform .28s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .drawer.open { transform: translateX(0); }
  .drawer .close {
    position: absolute; top: 14px; right: 14px;
    width: 30px; height: 30px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--bg); color: var(--text-dim);
    font-size: 15px; line-height: 1; cursor: pointer;
  }
  .drawer .close:hover { color: var(--slate); border-color: var(--slate); }
  .drawer .d-eyebrow {
    font-family: ui-monospace, monospace;
    font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.10em; color: var(--text-dim);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .drawer .d-eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .drawer h2 {
    margin: 0 0 12px;
    font-family: ui-serif, Georgia, serif;
    font-size: 22px; font-weight: 500;
    letter-spacing: -0.01em; color: var(--slate);
    line-height: 1.18;
  }
  .drawer p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.55; }
  .drawer .kv { border-top: 1px solid var(--border); margin-top: 12px; }
  .drawer .kv-row {
    display: grid; grid-template-columns: 86px 1fr; gap: 10px;
    padding: 7px 0; font-size: 12.5px;
    border-bottom: 1px dashed var(--border);
  }
  .drawer .kv-row:last-child { border-bottom: none; }
  .drawer .kv-row .k {
    font-family: ui-monospace, monospace;
    color: var(--text-dim); font-size: 10.5px;
    letter-spacing: 0.04em; text-transform: uppercase; padding-top: 2px;
  }
  .drawer code {
    font-family: ui-monospace, monospace; font-size: 12px;
    background: var(--bg-2); padding: 1px 5px; border-radius: 4px; color: var(--slate);
  }
  .drawer .more {
    display: inline-block; margin-top: 14px;
    font-family: ui-monospace, monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--clay); text-decoration: none;
    border-bottom: 1px dotted var(--clay);
  }
  .drawer .more:hover { background: rgba(217,119,87,0.08); }

  /* ---- Footer ---- */
  footer.bot {
    border-top: 1px solid var(--border);
    padding: 13px 24px;
    color: var(--text-dim);
    font-size: 12px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    font-family: ui-monospace, monospace;
    letter-spacing: 0.04em;
  }
  footer.bot a { color: var(--text-dim); text-decoration: none; border-bottom: 1px dotted var(--border-hi); }
  footer.bot a:hover { color: var(--clay); border-bottom-color: var(--clay); }
  footer.bot .legend { display: flex; gap: 16px; align-items: center; }
  footer.bot .legend span { display: inline-flex; align-items: center; gap: 6px; }
  footer.bot .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  /* ---- Mobile ---- */
  @media (max-width: 720px) {
    header.top { padding: 8px 12px; gap: 8px; }
    header.top .masthead { gap: 10px; }
    .chips { flex-basis: 100%; }  /* chips drop to their own scrollable row */
    header.top .masthead .logo { width: 84px; }
    header.top .masthead .divider { display: none; }
    header.top .eyebrow { display: none; }
    header.top h1 { font-size: 13px; line-height: 1.15; }
    .btn { padding: 6px 10px; font-size: 10.5px; }
    .caption { font-size: 10px; padding-top: 5px; min-height: 24px; }
    .stage-wrap { padding: 2px 8px 16px; }
    .drawer {
      top: auto; right: 0; left: 0; bottom: 0;
      width: 100%; max-width: none;
      max-height: 68vh;
      border-radius: 16px 16px 0 0;
      transform: translateY(105%);
    }
    .drawer.open { transform: translateY(0); }
    footer.bot .legend { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    svg.map .node.pulsing .card { animation: none; filter: drop-shadow(0 0 6px rgba(217,119,87,0.5)); }
    .drawer { transition: none; }
  }
</style>
</head>

      kv:[['checks','caps · allow-lists · rules'],['reject →','revise or abort']],

  { id:'extapi', x:860, y:628, w:170, h:64, zone:'guard', num:'c', name:'External API',

const HIRE_DRAWER = {
  headline:'Maestro suggests; the customer approves.',
  body:'On approval, the tool\'s Skill is loaded into the specialist\'s context, a folder appears in the customer\'s brain repo, and the dashboard gains the tool\'s widget. The ghost rows are unhired capacity — same tool, future companies.',
  kv:[['trigger','approve card in dashboard'],['loads','Skill → agent context'],['surfaces','brain folder · widget']],
  link:['design.html#roadmap','the hiring roadmap'] };
const WORK_DRAWER = {
  headline:'The specialist does the work.',
  body:'Wakes on its shift (cron), on demand (Maestro), or on events. Billable actions go through the tool\'s CLI — validated, executed, audited. Results return as a job-contract response; bash exists in the µVM only for ancillary work.',
  kv:[['triggers','cron · demand · event'],['output','contract response + brain commits'],['hot path','CLI, never bash']],
  link:['design.html#contract','what comes back'] };

const EDGES = [
  { from:'spec',     to:'executor', label:'spec',     route:'curve'  },
  { from:'executor', to:'reviewer', label:'review',   route:'down'   },
  { from:'reviewer', to:'executor', label:'revise',   route:'loop',  lpos:[436, 186, 'start'] },
  { from:'reviewer', to:'publish',  label:'approved', route:'curve', lpos:[428, 416, 'end'] },
  { from:'publish',  to:'catalog',  label:'',         route:'h'      },
  { from:'catalog',  to:'hire-0',   label:'pull',     route:'curve'  },
  { from:'hire-0',   to:'work-0',   label:'',         route:'h'      },
  { from:'catalog',  to:'hire-1',   label:'',         route:'curve', ghost:true },
  { from:'hire-1',   to:'work-1',   label:'',         route:'h',     ghost:true },
  { from:'catalog',  to:'hire-2',   label:'',         route:'curve', ghost:true },
  { from:'hire-2',   to:'work-2',   label:'',         route:'h',     ghost:true },
  // guarded strip
  { from:'work-0',     to:'proposal',   label:'', route:'drop',  ghost:true, cls:'strip-edge' },
  { from:'proposal',   to:'guardrails', label:'', route:'h',     ghost:true, cls:'strip-edge' },
  { from:'guardrails', to:'extapi',     label:'', route:'h',     ghost:true, cls:'strip-edge' },
  { from:'extapi',     to:'audit',      label:'', route:'h',     ghost:true, cls:'strip-edge' },
];

const COMPANY_LABELS = ['Company 1', 'Company 2', 'Company 3'];
const SHIFT_TAGS = ['Lou · daily', 'Roy · night', 'Sal · 24/7'];

/* ============================================================ */
/* Build the SVG                                                 */
/* ============================================================ */
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const byId = {};
NODES.forEach(n => byId[n.id] = n);
const cx = n => n.x + n.w / 2;
const cy = n => n.y + n.h / 2;

/* edges first (under nodes) */
const edgeLayer = $('edges');
function edgePath(e) {
  const a = byId[e.from], b = byId[e.to];
  if (e.route === 'down')  return `M ${cx(a)} ${a.y + a.h} L ${cx(b)} ${b.y}`;
  if (e.route === 'loop') {
    const x = a.x + a.w, ya = cy(a), yb = cy(b);
    return `M ${x} ${ya} C ${x + 58} ${ya}, ${x + 58} ${yb}, ${x} ${yb}`;
  }
  if (e.route === 'h')     return `M ${a.x + a.w} ${cy(a)} L ${b.x} ${cy(b)}`;
  if (e.route === 'drop') { // work-0 down into the strip's first node, entering from the top
    const xa = cx(a), ya = a.y + a.h, xb = cx(b), yb = b.y;
    return `M ${xa} ${ya} C ${xa} ${ya + 400}, ${xb} ${yb - 170}, ${xb} ${yb}`;
  }
  // curve (default): right edge → left edge
  const x1 = a.x + a.w, y1 = cy(a), x2 = b.x, y2 = cy(b);
  const dx = (x2 - x1) * 0.5;
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}
EDGES.forEach(e => {
  const g = el('g', { class: 'ghostable' + (e.ghost ? ' ghost' : '') }, edgeLayer);
  g.dataset.edge = `${e.from}→${e.to}`;
  const p = el('path', { d: edgePath(e), class: 'edge' + (e.route === 'loop' ? ' loop' : '') }, g);
  // arrowhead
  const b = byId[e.to];
  let hx, hy, ang;
  if (e.route === 'down') { hx = cx(b); hy = b.y; ang = Math.PI / 2; }
  else if (e.route === 'loop') { hx = b.x + b.w + 3; hy = cy(b); ang = Math.PI; }
  else if (e.route === 'drop') { hx = cx(b); hy = b.y; ang = Math.PI / 2; }
  else { hx = b.x; hy = b.y + b.h / 2; ang = 0; }
  const s = 6;
  el('path', {
    d: `M ${hx} ${hy} L ${hx - s * Math.cos(ang - .5)} ${hy - s * Math.sin(ang - .5)} M ${hx} ${hy} L ${hx - s * Math.cos(ang + .5)} ${hy - s * Math.sin(ang + .5)}`,
    class: 'edge' + (e.route === 'loop' ? ' loop' : ''),
  }, g);
  if (e.label) {
    let lx, ly, anchor = 'middle';
    if (e.lpos) { [lx, ly, anchor] = e.lpos; }
    else if (e.route === 'down') { lx = cx(byId[e.from]) + 8; ly = (byId[e.from].y + byId[e.from].h + b.y) / 2; }
    else { lx = (byId[e.from].x + byId[e.from].w + b.x) / 2; ly = Math.min(cy(byId[e.from]), cy(b)) - 10; }
    const t = el('text', { x: lx, y: ly, class: 'edge-label', 'text-anchor': anchor }, g);
    t.textContent = e.label;
  }
});

/* nodes */
const nodeLayer = $('nodes');
NODES.forEach(n => {
  const g = el('g', {
    class: 'node ghostable' + (n.ghost ? ' ghost' : ''),
    tabindex: '0', role: 'button',
    'aria-label': `${n.name} — ${n.sub}`,
  }, nodeLayer);
  g.dataset.id = n.id;
  el('rect', { class: 'card', x: n.x, y: n.y, width: n.w, height: n.h, rx: 13 }, g);
  el('rect', { class: 'strip', x: n.x, y: n.y + 13, width: 3.5, height: n.h - 26, fill: ZONE_COLOR[n.zone] }, g);
  if (!n.small) {
    const num = el('text', { class: 'num', x: n.x + 16, y: n.y + 22 }, g); num.textContent = n.num;
    const zn  = el('text', { class: 'zone', x: n.x + n.w - 12, y: n.y + 22, 'text-anchor': 'end' }, g);
    zn.textContent = ZONE_NAME[n.zone].split(' ')[0];
    const nm = el('text', { class: 'name', x: n.x + 16, y: n.y + 50 }, g); nm.textContent = n.name;
    const sb = el('text', { class: 'sub', x: n.x + 16, y: n.y + 72 }, g); sb.textContent = n.sub;
  } else {
    const nm = el('text', { class: 'name', x: n.x + 14, y: n.y + 30, style: 'font-size:16px' }, g); nm.textContent = n.name;
    const sb = el('text', { class: 'sub', x: n.x + 14, y: n.y + 49 }, g); sb.textContent = n.sub;
  }
  if (n.kind === 'work') {
    const tag = el('text', { class: 'shift-tag', x: n.x + n.w - 12, y: n.y + n.h - 12, 'text-anchor': 'end' }, g);
    tag.textContent = SHIFT_TAGS[n.row];
    tag.dataset.shiftRow = n.row;
  }
  g.addEventListener('click', () => openDrawer(n.id));
  g.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openDrawer(n.id); }
  });
});

/* extras: company labels, timeline, approval pill, verdict */
const extras = $('extras');
COMPANY_LABELS.forEach((label, i) => {
  const hire = byId[`hire-${i}`];
  const t = el('text', {
    class: 'company-label ghostable' + (i > 0 ? ' ghost' : ''),

/* timeline (hidden until shifts sequence) */
const tl = el('g', { class: 'timeline hidden', id: 'timeline' }, extras);
const TL_X1 = 120, TL_X2 = 1200, TL_Y = 752;
el('line', { class: 'tl-line', x1: TL_X1, y1: TL_Y, x2: TL_X2, y2: TL_Y }, tl);
[['00:00', 0], ['06:00', .25], ['12:00', .5], ['18:00', .75], ['24:00', 1]].forEach(([lab, f]) => {
  const x = TL_X1 + (TL_X2 - TL_X1) * f;

const tlMarker = el('circle', { class: 'tl-marker', cx: TL_X1, cy: TL_Y, r: 5 }, tl);

/* approval pill (hire sequence) */
const approve = el('g', { class: 'approve hidden', id: 'approve' }, extras);
el('rect', { x: byId['hire-1'].x + 18, y: byId['hire-1'].y - 46, width: 134, height: 30, rx: 15 }, approve);
const apT = el('text', { x: byId['hire-1'].x + 85, y: byId['hire-1'].y - 26, 'text-anchor': 'middle' }, approve);
apT.textContent = '✓ APPROVED';

/* validator verdict (action sequence) */
const verdict = el('text', { class: 'verdict', x: cx(byId['guardrails']), y: byId['guardrails'].y - 10, 'text-anchor': 'middle' }, extras);
verdict.textContent = '✓ within caps';

/* packets layer */
const packetLayer = $('packets');
function makePacket(color) {
  const c = el('circle', { class: 'packet', r: 7, cx: 0, cy: 0, fill: color || 'var(--clay)' }, packetLayer);
  c.style.transition = REDUCED ? 'none' : `transform ${MOVE_MS}ms cubic-bezier(0.65, 0.05, 0.36, 1)`;
  return c;
}

/* ============================================================ */
/* Drawer                                                        */
/* ============================================================ */
const drawer = $('drawer');
const drawerContent = $('drawer-content');
let lastFocused = null;

function drawerData(id) {
  const n = byId[id];
  if (n.kind === 'hire') return { n, d: HIRE_DRAWER };
  if (n.kind === 'work') return { n, d: WORK_DRAWER };
  return { n, d: n.drawer };
}
function openDrawer(id) {
  const { n, d } = drawerData(id);
  document.querySelectorAll('.node.selected').forEach(x => x.classList.remove('selected'));
  document.querySelector(`.node[data-id="${id}"]`)?.classList.add('selected');
  drawerContent.innerHTML = `
    <div class="d-eyebrow"><span class="dot" style="background:${ZONE_COLOR[n.zone]}"></span>${ZONE_NAME[n.zone]} · ${n.num.toUpperCase()}</div>
    <h2>${d.headline}</h2>
    <p>${d.body}</p>
    <div class="kv">${d.kv.map(([k, v]) => `<div class="kv-row"><div class="k">${k}</div><div>${v}</div></div>`).join('')}</div>
    ${d.link ? `<a class="more" href="${d.link[0]}">${d.link[1]} →</a>` : ''}
  `;
  if (!drawer.classList.contains('open')) lastFocused = document.activeElement;
  drawer.classList.add('open');
  $('drawer-close').focus({ preventScroll: true });
}
function closeDrawer() {
  drawer.classList.remove('open');
  document.querySelectorAll('.node.selected').forEach(x => x.classList.remove('selected'));
  if (lastFocused?.focus) lastFocused.focus({ preventScroll: true });
}
$('drawer-close').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
$('map').addEventListener('click', e => { if (e.target === $('map')) closeDrawer(); });

/* ============================================================ */
/* Sequence engine                                               */
/* ============================================================ */
let gen = 0;
const caption = $('caption');
const wait = ms => new Promise(r => setTimeout(r, ms));
const alive = g => g === gen;

function setCaption(text, live = true) {
  caption.textContent = text;
  caption.classList.toggle('live', live);
}
function pulse(id, on = true) {
  const n = document.querySelector(`.node[data-id="${id}"]`);
  if (!n) return;
  document.querySelectorAll('.node.pulsing').forEach(x => x.classList.remove('pulsing'));
  if (on) n.classList.add('pulsing');
}
function clearPulses() { document.querySelectorAll('.node.pulsing').forEach(x => x.classList.remove('pulsing')); }
function placePacket(p, id) { const n = byId[id]; p.style.transform = `translate(${cx(n)}px, ${cy(n)}px)`; }
async function movePacket(g, p, id) {
  placePacket(p, id);
  await wait(MOVE_MS || 60);
  return alive(g);
}
function setGhost(selector, ghost) {
  document.querySelectorAll(selector).forEach(x => x.classList.toggle('ghost', ghost));
}
function rowGhost(i, ghost) {
  ['hire', 'work'].forEach(k => document.querySelector(`.node[data-id="${k}-${i}"]`)?.classList.toggle('ghost', ghost));
  document.querySelector(`[data-edge="catalog→hire-${i}"]`)?.classList.toggle('ghost', ghost);
  document.querySelector(`[data-edge="hire-${i}→work-${i}"]`)?.classList.toggle('ghost', ghost);
  document.querySelector(`[data-company-label="${i}"]`)?.classList.toggle('ghost', ghost);
}
function stripGhost(ghost) {
  ['proposal', 'guardrails', 'extapi', 'audit'].forEach(id =>
    document.querySelector(`.node[data-id="${id}"]`)?.classList.toggle('ghost', ghost));
  document.querySelectorAll('[data-edge="work-0→proposal"],[data-edge="proposal→guardrails"],[data-edge="guardrails→extapi"],[data-edge="extapi→audit"]')
    .forEach(x => x.classList.toggle('ghost', ghost));
}
function resetVisuals() {
  gen++;
  clearPulses();
  packetLayer.innerHTML = '';
  rowGhost(1, true); rowGhost(2, true); rowGhost(0, false);
  stripGhost(true);
  $('timeline').classList.add('hidden');
  $('approve').classList.add('hidden');
  verdict.classList.remove('show');
  document.querySelectorAll('.shift-tag').forEach(t => t.classList.remove('show'));
  document.querySelectorAll('.btn.seq.active').forEach(b => b.classList.remove('active'));
  setCaption('Click any stage to inspect it — or play a sequence.', false);
}

/* ---- Sequences ---- */
const SEQUENCES = {
  async build(g) {
    setCaption('The factory builds once — spec, build, critique, publish.');
    const p = makePacket('var(--clay)');
    placePacket(p, 'spec'); p.classList.add('visible');
    pulse('spec');
    await wait(STEP_MS); if (!alive(g)) return;

    const legs = [
      ['executor', 'var(--clay)', 'The Executor writes the CLI and the Skill in a fresh µVM.'],
      ['reviewer', 'var(--clay)', 'The Reviewer runs the tests and critiques: [MUST] / [SHOULD].'],
      ['executor', 'var(--clay)', 'Revision round — the Executor addresses every [MUST].'],
      ['reviewer', 'var(--clay)', 'Re-review. Zero [MUST] left → approved.'],
      ['publish',  'var(--clay)', 'Pushed to tenwhy-tools, version-tagged, µVM torn down.'],
      ['catalog',  'var(--sky)',  'Registered in the catalog — the wall between factory and workforce.'],
    ];
    for (const [id, color, note] of legs) {
      p.setAttribute('fill', color);
      if (!await movePacket(g, p, id)) return;
      pulse(id); setCaption(note);
      await wait(STEP_MS); if (!alive(g)) return;
    }

    setCaption('One catalog entry → three companies hire in parallel.');
    rowGhost(1, false); rowGhost(2, false);
    await wait(650); if (!alive(g)) return;

    const p2 = makePacket('var(--sky)'), p3 = makePacket('var(--sky)');
    [p2, p3].forEach(x => { placePacket(x, 'catalog'); x.classList.add('visible'); });
    await wait(REDUCED ? 200 : 420); if (!alive(g)) return;

    const packets = [p, p2, p3];
    clearPulses();
    packets.forEach((pk, i) => { pk.setAttribute('fill', 'var(--olive)'); placePacket(pk, `hire-${i}`); });
    await wait(MOVE_MS + 350); if (!alive(g)) return;

    packets.forEach((pk, i) => placePacket(pk, `work-${i}`));
    await wait(MOVE_MS + 500); if (!alive(g)) return;

    packets.forEach(pk => pk.classList.remove('visible'));
    setCaption('Built once. Hired everywhere. — replay, or click any stage to inspect.');
  },

  async action(g) {
    setCaption('Sac (SEM) decides to lower a bid — watch what stands between the model and Meta.');
    stripGhost(false);
    pulse('work-0');
    const p = makePacket('var(--olive)');
    placePacket(p, 'work-0'); p.classList.add('visible');
    await wait(STEP_MS); if (!alive(g)) return;

    if (!await movePacket(g, p, 'proposal')) return;
    pulse('proposal'); setCaption('The LLM emits one JSON proposal — it cannot touch the network.');
    await wait(STEP_MS); if (!alive(g)) return;

    p.setAttribute('fill', 'var(--sky)');
    if (!await movePacket(g, p, 'guardrails')) return;
    pulse('guardrails'); setCaption('Deterministic guardrails: spend caps, allow-lists, time rules.');
    verdict.classList.add('show');
    await wait(STEP_MS + 250); if (!alive(g)) return;
    verdict.classList.remove('show');

    if (!await movePacket(g, p, 'extapi')) return;
    pulse('extapi'); setCaption('The tool\'s API client executes with scoped, short-lived credentials.');
    await wait(STEP_MS); if (!alive(g)) return;

    p.setAttribute('fill', 'var(--clay)');
    if (!await movePacket(g, p, 'audit')) return;
    pulse('audit'); setCaption('Three audit writes: action_log · log stream · history.html in the brain.');
    await wait(STEP_MS + 350); if (!alive(g)) return;

    p.classList.remove('visible');
    clearPulses();
    setCaption('The model proposes. Code decides. Everything is written down.');
  },

  async shifts(g) {
    setCaption('One company, three agents, three rhythms — the scheduler wakes Maestro; Maestro wakes the agent.');
    rowGhost(1, false); rowGhost(2, false);
    document.querySelectorAll('[data-company-label]').forEach(t => t.classList.add('ghost'));
    document.querySelectorAll('.shift-tag').forEach(t => t.classList.add('show'));
    $('timeline').classList.remove('hidden');
    closeDrawer();
    await wait(700); if (!alive(g)) return;

    const SWEEP = REDUCED ? 2400 : 9000;
    // reset marker to 00:00 without animating, then start the sweep
    tlMarker.style.transition = 'none';
    tlMarker.style.transform = 'translateX(0px)';
    tlMarker.getBoundingClientRect(); // force reflow
    tlMarker.style.transition = REDUCED ? 'none' : `transform ${SWEEP}ms linear`;
    // rows: 0=Lou daily, 1=Roy night, 2=Sal 24/7 per SHIFT_TAGS
    const plan = [
      { f: 0.02, row: 2, note: '00:00 — Sal is always on' },
      { f: 0.25, row: 0, note: '06:00 — Lou (daily) wakes, closes the books' },
      { f: 0.50, row: 2, note: '12:00 — Sal, still on' },
      { f: 0.93, row: 1, note: '22:30 — Roy (night) starts the market watch' },
    ];
    const t0 = performance.now();
    requestAnimationFrame(() => { tlMarker.style.transform = `translateX(${TL_X2 - TL_X1}px)`; });
    for (const ev of plan) {
      const at = ev.f * SWEEP - (performance.now() - t0);
      if (at > 0) await wait(at);
      if (!alive(g)) return;
      pulse(`work-${ev.row}`);
      setCaption(ev.note);
    }
    await wait(Math.max(0, SWEEP - (performance.now() - t0)) + 400);
    if (!alive(g)) return;
    clearPulses();
    setCaption('Shifts are cron; urgency is on-demand; reactions are events.');
  },

  async hire(g) {
    setCaption('Maestro spots the gap and suggests the hire.');
    pulse('hire-1');
    closeDrawer();
    await wait(STEP_MS); if (!alive(g)) return;

    setCaption('The customer clicks Approve — humans stay in the loop.');
    $('approve').classList.remove('hidden');
    await wait(STEP_MS + 300); if (!alive(g)) return;

    setCaption('The Skill is pulled from the catalog into the new specialist\'s context.');
    const p = makePacket('var(--sky)');
    placePacket(p, 'catalog'); p.classList.add('visible');
    pulse('catalog');
    await wait(REDUCED ? 300 : 500); if (!alive(g)) return;

    rowGhost(1, false);
    p.setAttribute('fill', 'var(--olive)');
    if (!await movePacket(g, p, 'hire-1')) return;
    pulse('hire-1');
    setCaption('The Skill loads into the new specialist\'s context.');
    await wait(STEP_MS); if (!alive(g)) return;

    if (!await movePacket(g, p, 'work-1')) return;
    pulse('work-1');
    setCaption('The specialist starts working its shift.');
    await wait(STEP_MS); if (!alive(g)) return;

    p.classList.remove('visible');
    $('approve').classList.add('hidden');
    clearPulses();
    setCaption('Hired. A folder appears in the brain; a widget appears on the dashboard.');
  },
};

/* chip wiring */
document.querySelectorAll('.btn.seq').forEach(btn => {
  btn.addEventListener('click', async () => {
    resetVisuals();
    closeDrawer();
    const myGen = ++gen;
    btn.classList.add('active');
    await SEQUENCES[btn.dataset.seq](myGen);
    if (alive(myGen)) btn.classList.remove('active');
  });
});
$('reset-btn').addEventListener('click', () => { resetVisuals(); closeDrawer(); });
</script>
</body>
